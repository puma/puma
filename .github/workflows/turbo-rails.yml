name: turbo-rails

# Note: turbo-rails often returns an ActionDispatch::Response::RackBody for the
# body. Also, Rack::BodyProxy or Sprockets::Asset.

on:
  push:
    branches:
      - main
      - '*-stable'
    paths: &turbo_paths
      - '**/*'
      - '!**/*.md'
      - '!docs/**'
      - '!.agents/**'
      - '!benchmarks/**'
      - '!test/**'
      - '!.github/workflows/*.yml'
      - '.github/workflows/turbo-rails.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *turbo_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  turbo-rails:
    name: >-
      ${{ matrix.os }} Ruby ${{ matrix.ruby }} Rails ${{ matrix.rails }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    if: |
      github.event.pull_request.draft != true
      && !(   contains(github.event.pull_request.title,  '[ci skip]')
           || contains(github.event.pull_request.title,  '[skip ci]'))
    strategy:
      fail-fast: false
      matrix:
        include:
          # Run only the latest stable Ruby/Rails pairing.
          - { os: ubuntu-26.04 , ruby: '4.0', rails: '8.1' }
    env:
      CI: true
      FERRUM_PROCESS_TIMEOUT: 60
      FERRUM_DEFAULT_TIMEOUT: 60
      RAILS_VERSION: "${{ matrix.rails }}"

    steps:
      - name: checkout hotwired/turbo-rails
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hotwired/turbo-rails
          ref: 37530c08780fa6f6dbb56a633de4b81169bdd174

      - name: turbo-rails updates
        run: |
          # use repo & commit being tested, $GITHUB_REPOSITORY allows forks to work
          SRC="gem ['\"]puma['\"].*"
          DST="gem 'puma', git: 'https://github.com/$GITHUB_REPOSITORY.git', ref: '$GITHUB_SHA'"
          sed -i "s#$SRC#$DST#" Gemfile
          # use rack main with ruby master
          SRC="gem 'rack'"
          DST="if RUBY_PATCHLEVEL == -1\n  gem 'rack', git: 'https://github.com/rack/rack', ref: 'main'\nelse\n  gem 'rack'\nend"
          sed -i "s#$SRC#$DST#" Gemfile
          #
          SRC="gem ['\"]sqlite3['\"].*"
          DST="gem 'sqlite3', '~> 2.7'"
          sed -i "s#$SRC#$DST#" Gemfile
          #
          # Rails 8.1 passes positional options to JSON.parse; JSON 3 requires keywords.
          echo 'gem "json", "~> 2.18"' >> Gemfile
          #
          # use `minitest-mock`
          SRC="gem ['\"]rexml['\"]"
          DST="gem 'rexml'\n  gem 'minitest-mock'"
          sed -i "s#$SRC#$DST#" Gemfile
          #
          # use `stdio` for log_writer, always have one thread existing
          SRC="Silent: true"
          DST="Silent: false, Threads: '1:4'"
          sed -i "s/$SRC/$DST/" test/application_system_test_case.rb
          cat Gemfile

      - name: load ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          rubygems: latest
          bundler-cache: true
          cache-version: "turbo-rails-${{ matrix.rails }}"
        timeout-minutes: 10

      - name: turbo-rails Gemfile.lock
        run: cat Gemfile.lock

      - name: turbo-rails test
        run: bin/test test/**/*_test.rb -v
