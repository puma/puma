name: ragel

on:
  push:
    branches:
      - main
    paths:
      - 'ext/**'
      - '.github/workflows/ragel.yml'
  pull_request:
    paths:
      - 'ext/**'
      - '.github/workflows/ragel.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  skip_duplicate_runs:
    uses: ./.github/workflows/skip_duplicate_workflow_runs.yml
    with:
      paths: '["ext/**", ".github/workflows/ragel.yml"]'

  ragel:
    name: >-
      ragel ${{ matrix.os }} ${{ matrix.ruby }}
    needs: skip_duplicate_runs
    env:
      PUMA_NO_RUBOCOP: true
      PUMA_TEST_DEBUG: true

    runs-on: ${{ matrix.os }}
    if: |
      !(   contains(github.event.pull_request.title,  '[ci skip]')
        || contains(github.event.pull_request.title,  '[skip ci]')
        || (needs.skip_duplicate_runs.outputs.should_skip == 'true'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04 , ruby: head }

    steps:
      - name: repo checkout
        uses: actions/checkout@v7

      - name: load ruby
        uses: ruby/setup-ruby-pkgs@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          apt-get: ragel
          bundler-cache: true
          cache-version: ragel
        timeout-minutes: 10

      - name: check ragel generation
        run: |
          ragel --version
          rm ext/puma_http11/http11_parser.c ext/puma_http11/org/jruby/puma/Http11Parser.java
          bundle exec rake ragel
          if [ -n "$(git status --porcelain)" ]; then
            git --no-pager diff
            echo "bundle exec rake ragel changes a file"
            exit 1
          fi

      - name: save ragel generated files on fail
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: ${{ matrix.os }}-ragel-generated-files
          path: |
            ext/puma_http11/http11_parser.c
            ext/puma_http11/org/jruby/puma/Http11Parser.java
