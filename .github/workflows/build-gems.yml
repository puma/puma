name: build-gems

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.agents/skills/releasing-puma/scripts/**'
      - '.github/workflows/build-gems.yml'
      - 'Rakefile'
      - 'puma.gemspec'
      - 'test/gem_manifest.rb'
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to build
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: .agents/skills/releasing-puma/scripts/build-gems "${REF:-HEAD}"
        env:
          REF: ${{ inputs.ref || (github.ref_type == 'tag' && github.ref_name) || '' }}
      - run: cat tmp/release/build-*/pkg/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gems-${{ inputs.ref || github.ref_name }}
          path: tmp/release/build-*/pkg/
          if-no-files-found: error
