ignores:
  - rule: dangerous-triggers
    file: .github/workflows/pr-label-status.yml
    reason: Label writes on fork PRs require pull_request_target; checkout uses the base branch and no contributor code runs.
  - rule: dangerous-triggers
    file: .github/workflows/perf-comment.yml
    reason: Commenting on a fork's PR, and rerunning Duel when its accept label changes, take a write token. It checks nothing out, runs no contributor code, and reads the Perf run's report only as data.
